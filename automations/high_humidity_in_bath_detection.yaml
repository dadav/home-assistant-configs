---
# High humidity in bath detection automation
#
# This automation detects a high humidity value in baths.
#
id: 6b0f392f-9afd-4db4-bde7-f961f5391ada
mode: single
max_exceeded: silent
alias: High humdity in baths detection
description: |-
  This automation detects high humidity in my bathrooms.

  High humidity is bad because it can lead to mold. I
  should therefore always try to get it down to 50-60%.
  Most problematic for this problem are baths, because
  the humidity after taking is shower is usually very
  high.

  Reminds me every hour (or after the chosen snooze time) until
  the humidity is below the threshold again. No reminders while
  I'm probably sleeping.

  Swiping the notification away mutes it until the state changes
  and the automation triggers again.
triggers:
  - trigger: numeric_state
    entity_id:
      - sensor.bath1_temp_humidity
      - sensor.bath2_temp_humidity
    above: input_number.bathroom_setting_humidity_high
actions:
  - variables:
      action_cooldown15: "{{ 'COOLDOWN15_' ~ context.id }}"
      action_cooldown60: "{{ 'COOLDOWN60_' ~ context.id }}"
      action_cooldown180: "{{ 'COOLDOWN180_' ~ context.id }}"
  - alias: "Keep reminding until the humidity is low again"
    repeat:
      until:
        - alias: "No numeric sensor is above the threshold (unavailable ones are ignored)"
          condition: template
          value_template: >-
            {{
              expand(['sensor.bath1_temp_humidity', 'sensor.bath2_temp_humidity'])
              | map(attribute='state') | select('is_number') | map('float')
              | select('>=', states('input_number.bathroom_setting_humidity_high') | float(100))
              | list | count == 0
            }}
      sequence:
        - alias: "Wait until I'm awake"
          wait_template: "{{ is_state('binary_sensor.probably_sleeping', 'off') }}"
          timeout: "12:00:00"
        - action: notify.mobile_app_pixel_7
          data:
            title: "High humidity in the bath!"
            message: |-
              Above {{ states('input_number.bathroom_setting_humidity_high') }}%:
              {% for s in expand(['sensor.bath1_temp_humidity', 'sensor.bath2_temp_humidity'])
                 if is_number(s.state)
                 and s.state | float >= states('input_number.bathroom_setting_humidity_high') | float %}
              - {{ s.name }} ({{ s.state }}%)
              {% endfor %}
            data:
              tag: high_humidity_bath
              color: yellow
              notification_icon: mdi:water-percent
              actions:
                - action: "{{ action_cooldown15 }}"
                  title: 15 mins
                - action: "{{ action_cooldown60 }}"
                  title: 1 h
                - action: "{{ action_cooldown180 }}"
                  title: 3 h
        - wait_for_trigger:
            - trigger: event
              event_type: mobile_app_notification_action
              event_data:
                action: "{{ action_cooldown15 }}"
              id: snooze15
            - trigger: event
              event_type: mobile_app_notification_action
              event_data:
                action: "{{ action_cooldown60 }}"
              id: snooze60
            - trigger: event
              event_type: mobile_app_notification_action
              event_data:
                action: "{{ action_cooldown180 }}"
              id: snooze180
            - trigger: event
              event_type: mobile_app_notification_cleared
              event_data:
                tag: high_humidity_bath
              id: dismissed
          timeout: "01:00:00"
          continue_on_timeout: true
        - choose:
            - conditions: "{{ wait.trigger and wait.trigger.id == 'dismissed' }}"
              sequence:
                - stop: "Notification dismissed, muted until the state changes again"
            - conditions: "{{ wait.trigger and wait.trigger.id == 'snooze15' }}"
              sequence:
                - delay: "00:15:00"
            - conditions: "{{ wait.trigger and wait.trigger.id == 'snooze60' }}"
              sequence:
                - delay: "01:00:00"
            - conditions: "{{ wait.trigger and wait.trigger.id == 'snooze180' }}"
              sequence:
                - delay: "03:00:00"
  - action: notify.mobile_app_pixel_7
    data:
      message: clear_notification
      data:
        tag: high_humidity_bath
