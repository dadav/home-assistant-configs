---
# Office 2 light switcher automation
#
# This automation switches the lights on and off in
# the other office.
#
id: "379f4de2-2c0d-412e-a1e4-0626b5713ece"
alias: "Office 2 light switcher"
description: >-
  This automation is a simple button / light connector.
  Single click toggles, double click sets 50%, triple click 25%.
mode: queued
max: 5
triggers:
  - trigger: state
    entity_id: sensor.office2_button_action
    to: "single"
    id: single_click
  - trigger: state
    entity_id: sensor.office2_button_action
    to: "double"
    id: double_click
  - trigger: state
    entity_id: sensor.office2_button_action
    to: "triple"
    id: triple_click
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: single_click
        sequence:
          - alias: "Toggle the light"
            action: light.toggle
            target:
              entity_id: light.office2_light
            data:
              brightness_pct: 100
      - conditions:
          - condition: trigger
            id: double_click
        sequence:
          - alias: "Dim the light to 50%"
            action: light.turn_on
            target:
              entity_id: light.office2_light
            data:
              brightness_pct: 50
      - conditions:
          - condition: trigger
            id: triple_click
        sequence:
          - alias: "Dim the light to 25%"
            action: light.turn_on
            target:
              entity_id: light.office2_light
            data:
              brightness_pct: 25
