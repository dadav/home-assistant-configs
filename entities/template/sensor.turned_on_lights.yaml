---
#
# Small sensor which contains names of the turned on lights.
#

sensor:
  - name: Turned on lights
    unique_id: "09b77aa8-6f77-4f9e-866e-4446c4fe1c3e"
    icon: "mdi:lightbulb-group"
    availability: "{{ state_attr('light.all_lights', 'entity_id') is not none }}"
    state: |-
      {% for light in state_attr('light.all_lights', 'entity_id') or [] if is_state(light, 'on') %}
      - {{ state_attr(light, 'friendly_name') }}
      {% endfor %}
