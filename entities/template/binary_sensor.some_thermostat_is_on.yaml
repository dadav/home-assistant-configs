---
#
# Small binary sensor which is on if any thermostat is heating.
#
binary_sensor:
  - name: Some thermostat is on
    unique_id: "a6eef52f-44c6-4d66-85ff-f48ce6126de9"
    icon: "mdi:home-thermometer"
    state: >-
      {{
        [
          'climate.bad',
          'climate.buro_1',
          'climate.buro_2',
          'climate.esszimmer_1',
          'climate.esszimmer_2',
          'climate.schlafzimmer_1',
          'climate.schlafzimmer_2',
          'climate.wohnzimmer',
        ] | select('is_state', 'heat') | list | count > 0
      }}
