---
# The recorder component is storing details in a database which
# then are handled by the history component.
#
# https://www.home-assistant.io/integrations/recorder/
#
recorder:
  # Detailed history for two months. Older data stays available as
  # long term statistics (hourly min, mean, max) for sensors.
  purge_keep_days: 60
  # Batch writes to spare the SD card of the Pi (default is 5s)
  commit_interval: 30
  # exclude some entities
  exclude:
    domains:
      - device_tracker
      - weather
    entity_globs:
      - sensor.load_*m
      - sensor.dwd_*
      - sensor.network_*
    entities:
      - sensor.time
      - sensor.date
      - sensor.date_time
      - sensor.last_boot
      - sensor.disk_use_percent
