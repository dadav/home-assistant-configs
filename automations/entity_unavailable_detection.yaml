---
# Entity unavailable detection automation
#
# This automation notifies me if an important entity went unavailable
# for a while and clears the notification once it is back.
#
# Only the entities in the watch list are monitored. Listening to every
# state_changed event was too expensive on the Pi.
#
id: f8700e07-1e98-4c0e-bc76-72cb293811d9
mode: parallel
max_exceeded: silent
alias: Entity unavailable detection
description: >-
  Notifies me if a watched entity is unavailable for 30 minutes and
  removes the notification when it recovers.
triggers:
  - trigger: state
    # Watch list, starting with doors and windows
    entity_id: &watched_entities
      - binary_sensor.bath1_window_contact
      - binary_sensor.bedroom_door_contact
      - binary_sensor.bedroom_window_contact
      - binary_sensor.entrance_door_contact
      - binary_sensor.garage_door_contact
      - binary_sensor.kitchen_door_contact
      - binary_sensor.lunch_door_contact
      - binary_sensor.office1_window_contact
      - binary_sensor.office2_door_contact
      - binary_sensor.storage_door1_contact
      - binary_sensor.storage_door2_contact
      - binary_sensor.wintergarden_door_contact
      - binary_sensor.wintergarden_window_contact
      # Water
      - binary_sensor.bath2_waterdetector_water_leak
      # Climate sensors
      - sensor.bath1_temp_temperature
      - sensor.bath2_temp_temperature
      - sensor.bedroom_temp_temperature
      - sensor.garage_temp_temperature
      - sensor.kitchen_temp_temperature
      - sensor.kitchen_fridge_temperature
      - sensor.living_temp_temperature
      - sensor.office2_temp_temperature
      - sensor.outside_temp_temperature
      - sensor.storage_temp_temperature
      - sensor.wintergarden_temp_temperature
      - sensor.lunch_co2meter_co2
      # Thermostats
      - climate.bad
      - climate.buro_1
      - climate.buro_2
      - climate.esszimmer_1
      - climate.esszimmer_2
      - climate.schlafzimmer_1
      - climate.schlafzimmer_2
      - climate.wohnzimmer
      # Switches and lights
      - switch.bath1_powerplug
      - switch.kitchen_powerplug
      - switch.storage_power
      - switch.garage_power
      - light.office1_light2
      - light.office2_light
      # Others
      - lock.vordereingang_lock
      - binary_sensor.zigbee2mqtt_bridge_connection_state
    to: "unavailable"
    for: "00:30:00"
    id: unavailable
  - trigger: state
    entity_id: *watched_entities
    from: "unavailable"
    id: recovered
variables:
  entity_tag: "{{ 'unavailable_tag_' ~ trigger.entity_id }}"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: unavailable
        sequence:
          - action: notify.mobile_app_pixel_7
            data:
              title: "{{ trigger.to_state.name }} went unavailable."
              message: >-
                Unavailable since {{ trigger.to_state.last_changed | as_timestamp
                | timestamp_custom('%d.%m. %H:%M') }}.
              data:
                tag: "{{ entity_tag }}"
                notification_icon: "mdi:lan-disconnect"
                actions:
                  - action: URI
                    title: "Open {{ trigger.entity_id }}"
                    uri: "entityId:{{ trigger.entity_id }}"
      - alias: "Only clear when it was unavailable long enough to notify"
        conditions:
          - condition: trigger
            id: recovered
          - condition: template
            value_template: >-
              {{
                (trigger.to_state.last_changed - trigger.from_state.last_changed)
                .total_seconds() >= 1800
              }}
        sequence:
          - action: notify.mobile_app_pixel_7
            data:
              message: clear_notification
              data:
                tag: "{{ entity_tag }}"
