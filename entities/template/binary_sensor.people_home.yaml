---
#
# Small binary sensor to tell me if anyone is home
#
# Counts every person entity, so persons without trackers
# (state unknown) do not break it.
#
binary_sensor:
  - name: People home
    unique_id: "47fa6ec0-da11-4e65-bee6-1a7213d7c0d2"
    icon: "mdi:home-account"
    state: >-
      {{ states.person | selectattr('state', 'eq', 'home') | list | count > 0 }}
