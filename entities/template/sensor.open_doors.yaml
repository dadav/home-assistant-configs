---
#
# Small sensor which contains names of open doors.
#
sensor:
  - name: Open doors
    unique_id: "3ee4701c-9701-4c4d-a1f7-499796ad1745"
    icon: "mdi:door-open"
    availability: "{{ state_attr('binary_sensor.all_doors', 'entity_id') is not none }}"
    state: |-
      {% for door in state_attr('binary_sensor.all_doors', 'entity_id') or [] if is_state(door, 'on') %}
      - {{ state_attr(door, 'friendly_name') }}
      {% endfor %}
