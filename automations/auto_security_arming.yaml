---
# Auto security arming automation
#
# This automation arms the security alarm on certain conditions.
#
id: "d84b108c-44e8-4df9-ba5d-2cb83f38dee9"
alias: "Auto security arming mode"
description: |-
  When I turned on the auto security mode, I want the security
  system to be turned on in these conditions:

  - When I turned on the away mode
  - When I'm sleeping (no devices online and it's a certain time)
mode: queued
max_exceeded: silent
triggers:
  - alias: Away mode turned on
    trigger: state
    entity_id: input_boolean.away_mode
    from: "off"
    to: "on"
    id: away_on
  - alias: Away mode turned off
    trigger: state
    entity_id: input_boolean.away_mode
    from: "on"
    to: "off"
    id: away_off
  - alias: Sleeping state changed
    trigger: state
    entity_id: binary_sensor.probably_sleeping
    to:
      - "on"
      - "off"
    id: sleeping_check
  - alias: Periodic sleeping check
    trigger: time_pattern
    minutes: "/5"
    id: sleeping_check
  - alias: People are home
    trigger: state
    entity_id: binary_sensor.people_home
    from: "off"
    to: "on"
    id: people_home
conditions:
  - condition: state
    entity_id: input_boolean.auto_security_arming_mode
    state: "on"
actions:
  - choose:
      - alias: "Away mode turned on"
        conditions:
          - condition: trigger
            id: away_on
          - condition: not
            conditions:
              - condition: state
                entity_id: alarm_control_panel.security_alarm
                state: armed_away
        sequence:
          - alias: "Arm away"
            action: alarm_control_panel.alarm_arm_away
            target:
              entity_id: alarm_control_panel.security_alarm
      - alias: "Away mode turned off"
        conditions:
          - condition: trigger
            id: away_off
          - condition: state
            entity_id: alarm_control_panel.security_alarm
            state: armed_away
        sequence:
          - &arm_home
            alias: "Arm home"
            action: alarm_control_panel.alarm_arm_home
            target:
              entity_id: alarm_control_panel.security_alarm
      - alias: "Night time"
        conditions:
          - condition: trigger
            id: sleeping_check
          - condition: state
            entity_id: binary_sensor.probably_sleeping
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: alarm_control_panel.security_alarm
                state: armed_night
        sequence:
          - alias: "Arm night"
            action: alarm_control_panel.alarm_arm_night
            target:
              entity_id: alarm_control_panel.security_alarm
      - alias: "Day time"
        conditions:
          - condition: trigger
            id: sleeping_check
          - condition: state
            entity_id: binary_sensor.probably_sleeping
            state: "off"
          - condition: state
            entity_id: alarm_control_panel.security_alarm
            state: armed_night
        sequence:
          - *arm_home
      - alias: "People are home"
        conditions:
          - condition: trigger
            id: people_home
          - condition: not
            conditions:
              - condition: state
                entity_id: alarm_control_panel.security_alarm
                state: armed_home
        sequence:
          - *arm_home
