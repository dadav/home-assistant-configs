---
# Low battery detection automation
#
# This automation detects sensor with low battery and notifies me.
#
# Based on blueprint: https://community.home-assistant.io/t/low-battery-level-detection-notification-for-all-battery-sensors
#
id: "727b293e-9ed4-40b2-ac34-9c4e14172f94"
mode: single
alias: "Low battery detection"
description: >-
  Every Sunday at noon I get a list of all battery sensors below the
  configured threshold.
variables:
  threshold: "{{ states('input_number.low_battery_warning_threshold') | int(20) }}"
  exclude: []
  sensors: >-
    {% set result = namespace(sensors=[]) %}
    {% for state in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
      {% if 0 <= state.state | int(-1) < threshold and state.entity_id not in exclude %}
        {% set result.sensors = result.sensors + ['- ' ~ state.name ~ ' (' ~ state.state ~ ' %)'] %}
      {% endif %}
    {% endfor %}
    {% for state in states.binary_sensor | selectattr('attributes.device_class', '==', 'battery') | selectattr('state', '==', 'on') %}
      {% if state.entity_id not in exclude %}
        {% set result.sensors = result.sensors + ['- ' ~ state.name] %}
      {% endif %}
    {% endfor %}
    {{ result.sensors | join('\n') }}
triggers:
  - trigger: time
    at: "12:00:00"
conditions:
  - condition: time
    weekday:
      - sun
  - "{{ sensors | trim != '' }}"
actions:
  - action: notify.mobile_app_pixel_7
    data:
      title: "Some sensors are low on battery, check them out!"
      message: "{{ sensors }}"
      data:
        color: "yellow"
        notification_icon: "mdi:battery-alert"
  - action: persistent_notification.create
    data:
      notification_id: low_battery
      title: "Some sensors are low on battery, check them out!"
      message: "{{ sensors }}"
