---
# This automation creates a notification on my phone and
# keeps it there until the reason is gone.
#
id: "3619ec5b-8463-449a-8bf0-5bac911b1ee4"
mode: parallel
max_exceeded: silent
alias: "Door open notification automation"
description: >-
  Send a notification to my phone when an outside door is open.
triggers:
  - trigger: state
    entity_id: &outside_doors
      - binary_sensor.garage_door_contact
      - binary_sensor.entrance_door_contact
      - binary_sensor.storage_door1_contact
      - binary_sensor.storage_door2_contact
    to: "on"
    id: opened
  - trigger: state
    entity_id: *outside_doors
    to: "off"
    id: closed
variables:
  entity_tag: "{{ 'open_door_tag_' ~ trigger.entity_id }}"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: opened
        sequence:
          - action: notify.mobile_app_pixel_7
            data:
              title: "{{ trigger.to_state.name }} is open."
              message: >-
                Open since {{ now().strftime('%H:%M') }}
              data:
                notification_icon: "mdi:door-open"
                tag: "{{ entity_tag }}"
                sticky: "true"
                actions:
                  - action: "URI"
                    title: "Open"
                    uri: "entityId:{{ trigger.entity_id }}"
      - conditions:
          - condition: trigger
            id: closed
        sequence:
          - action: notify.mobile_app_pixel_7
            data:
              message: "clear_notification"
              data:
                tag: "{{ entity_tag }}"
