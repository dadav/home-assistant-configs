---
# Office 1 light switcher automation
#
# This automation turns off the light in my office when I start
# working on my tower (the monitors are bright enough).
#
# The door contact and chair sensor of office 1 are gone, so only
# the device based rule is left.
#
id: "40c147c1-b3a1-4214-b002-7bf7d4af65d0"
alias: "Office 1 light switcher"
description: >-
  Turns the office 1 light off when my tower comes online.
mode: restart
triggers:
  - alias: Device turned on
    trigger: state
    entity_id: device_tracker.daniel_tower
    from: "not_home"
    to: "home"
conditions:
  - condition: state
    entity_id: input_boolean.office1_manage_lights
    state: "on"
  - condition: state
    entity_id: input_boolean.office1_device_on_lights_off
    state: "on"
  - condition: state
    entity_id: light.office1_light2
    state: "on"
actions:
  - alias: "Turn off the light"
    action: light.turn_off
    target:
      entity_id: light.office1_light2
    data:
      transition: 2
