---
# Security alarm detection automation
#
# This automation gets triggered when the security alarm enters its
# entry delay (pending) and again when it actually fires (triggered).
#
# The notification action id and tag are fixed on purpose: a new run
# restarts the old one, and the "Disarm" button of the notification
# that is already on the phone must keep working.
#
id: "68229927-07bf-4342-800b-20a291ce5ed4"
trace:
  stored_traces: 25
alias: "Security alarm triggered"
description: >-
  Notifies my phone with a disarm button as soon as the entry delay of
  the security alarm starts and again when the alarm fires. When the
  alarm fired and the notification was not received while I'm probably
  sleeping or nobody is home, it also calls me.
mode: restart
triggers:
  - alias: Entry delay started
    trigger: state
    entity_id: alarm_control_panel.security_alarm
    to: "pending"
    id: pending
  - alias: Alarm fired
    trigger: state
    entity_id: alarm_control_panel.security_alarm
    to: "triggered"
    id: triggered
  - alias: Entry delay ended without an alarm
    trigger: state
    entity_id: alarm_control_panel.security_alarm
    from: "pending"
    not_to: "triggered"
    id: settled
variables:
  action_disarm: DISARM_SECURITY_ALARM
  notify_message: >-
    The entity {{ states('input_text.last_security_alarm_entity') }} triggered the security alarm.
actions:
  - choose:
      - alias: "Disarmed or re-armed in time: remove the notification"
        conditions:
          - condition: trigger
            id: settled
        sequence:
          - action: notify.all_devices
            data:
              message: clear_notification
              data:
                tag: security_alarm
          - stop: "Entry delay ended without an alarm"
      - alias: "Entry delay: offer to disarm before the alarm fires"
        conditions:
          - condition: trigger
            id: pending
        sequence:
          - action: notify.all_devices
            data:
              title: "Security alarm is about to trigger"
              message: >-
                {{ states('input_text.last_security_alarm_entity') }} was opened.
                Disarm now if this is you.
              data:
                tag: security_alarm
                ttl: 0
                priority: high
                notification_icon: "mdi:shield-alert"
                color: orange
                actions:
                  - action: "{{ action_disarm }}"
                    title: "Disarm"
      - alias: "Alarm fired"
        conditions:
          - condition: trigger
            id: triggered
        sequence:
          - action: notify.all_devices
            data:
              title: &notify_title "Security alarm triggered"
              message: "{{ notify_message }}"
              data:
                tag: security_alarm
                ttl: 0
                priority: high
                channel: alarm_stream
                notification_icon: "mdi:alarm-light"
                color: red
                confirmation: true
                actions:
                  - action: "{{ action_disarm }}"
                    title: "Disarm"
          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_received
                event_data:
                  title: *notify_title
            timeout: "00:00:15"
            continue_on_timeout: true
          - alias: "Escalate when the notification wasnt received"
            if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
              - or:
                  - condition: state
                    entity_id: binary_sensor.probably_sleeping
                    state: "on"
                  - condition: state
                    entity_id: binary_sensor.people_home
                    state: "off"
            then:
              - alias: "Call phone via sip"
                action: hassio.addon_stdin
                data:
                  addon: ad61c150_dss_voip
                  input:
                    call_sip_uri: !secret emergency_sip_uri
                    message_tts: "{{ notify_message }}"
              - alias: "Turn on lights with breathe effect"
                action: light.turn_on
                data:
                  effect: breathe
                  brightness_pct: 100
                target:
                  entity_id: light.all_lights
  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_disarm }}"
    timeout: "00:05:00"
    continue_on_timeout: false
  - alias: "Disarm the security alarm"
    action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.security_alarm
