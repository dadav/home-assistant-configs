---
# Office 1 light button2 automation
#
# This automation handles the actions for my ikea button.
#
id: "45fc0aae-094e-4298-a033-fd155b30fd65"
alias: "Office 1 light button2"
description: >-
  This automation handles the actions for my second ikea button.
mode: queued
max: 5
triggers:
  - alias: Button2 on
    trigger: state
    entity_id: sensor.office1_button2_action
    to: "on"
    id: button_on
  - alias: Button2 off
    trigger: state
    entity_id: sensor.office1_button2_action
    to: "off"
    id: button_off
  - alias: Button2 left
    trigger: state
    entity_id: sensor.office1_button2_action
    to: "arrow_left_click"
    id: button_left
  - alias: Button2 right
    trigger: state
    entity_id: sensor.office1_button2_action
    to: "arrow_right_click"
    id: button_right
actions:
  - choose:
      - alias: "On button clicked"
        conditions:
          - condition: trigger
            id: button_on
        sequence:
          - alias: "Turn on the office1 light"
            action: light.turn_on
            target:
              entity_id: light.office1_light2
            data:
              brightness_pct: 100
              transition: 1
      - alias: "Off button clicked"
        conditions:
          - condition: trigger
            id: button_off
        sequence:
          - alias: "Turn off the office1 light"
            action: light.turn_off
            target:
              entity_id: light.office1_light2
            data:
              transition: 1
      - alias: "Left button clicked"
        conditions:
          - condition: trigger
            id: button_left
          - condition: state
            entity_id: light.office1_light2
            state: "on"
        sequence:
          - alias: "Decrease the brightness"
            action: light.turn_on
            target:
              entity_id: light.office1_light2
            data:
              brightness_step_pct: -20
              transition: 1
      - alias: "Right button clicked"
        conditions:
          - condition: trigger
            id: button_right
        sequence:
          - alias: "Increase the brightness"
            action: light.turn_on
            target:
              entity_id: light.office1_light2
            data:
              brightness_step_pct: 20
              transition: 1
