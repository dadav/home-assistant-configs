---
# Intrusion detection automation
#
# This automation detects suspicious activity and triggers the
# security alarm.
#
id: "cc881516-1e51-4b9c-9542-c4b261ac98c9"
mode: queued
max_exceeded: silent
trace:
  stored_traces: 25
alias: "Intrusion detection alarm trigger"
description: >-
  Detects unusual behaviour while I'm not at home or when
  I'm sleeping.

  When this automation is triggered, a security alarm will
  be triggered.

  The following things are considered unusual:
    - A window was opened
    - A door was opened

  At night, areas listed in sensor.skip_security_in_areas are ignored.
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.bath1_window_contact
      - binary_sensor.bedroom_door_contact
      - binary_sensor.bedroom_window_contact
      - binary_sensor.entrance_door_contact
      - binary_sensor.garage_door_contact
      - binary_sensor.kitchen_door_contact
      - binary_sensor.lunch_door_contact
      - binary_sensor.office1_window_contact
      - binary_sensor.office2_door_contact
      - binary_sensor.storage_door1_contact
      - binary_sensor.storage_door2_contact
      - binary_sensor.wintergarden_door_contact
      - binary_sensor.wintergarden_window_contact
    from: "off"
    to: "on"
conditions:
  - or:
      - condition: state
        entity_id: alarm_control_panel.security_alarm
        state: armed_away
      - and:
          - condition: state
            entity_id: alarm_control_panel.security_alarm
            state: armed_night
          - alias: "Area is not skipped at night"
            condition: template
            value_template: >-
              {{
                area_name(trigger.entity_id) is none
                or area_name(trigger.entity_id)
                  not in states('sensor.skip_security_in_areas')
              }}
actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.last_security_alarm_entity
    data:
      value: "{{ trigger.to_state.name }}"
  - action: alarm_control_panel.alarm_trigger
    target:
      entity_id: alarm_control_panel.security_alarm
