---
# Window or door open for too long reminder automation
#
# This automation reminds me if I left some window or door open
# for too long.
#
id: "8511c2ca-4ea3-429f-b3a3-e35bd6289e67"
mode: single
max_exceeded: silent
alias: "Window or door open for too long reminder"
description: |-
  This automation reminds me to close an open window or door.

  Sometimes I open a window or door to let some fresh air in
  and forget to close it again. This automations aims to prevent
  this.

  Only active when opening makes it worse: in summer mode when it is
  warmer outside, otherwise when it is colder outside. Needs both
  temperature sensors (outside_warmer_than_inside is unavailable
  without them).

  Swiping the notification away mutes it until the state changes
  and the automation triggers again.
triggers:
  - trigger: state
    entity_id: binary_sensor.everything_closed
    to: "off"
    for:
      minutes: "{{ states('input_number.max_open_window_or_door_time') | int(15) }}"
conditions:
  - condition: state
    entity_id: binary_sensor.probably_sleeping
    state: "off"
  - alias: "Opening makes it worse"
    condition: template
    value_template: >-
      {{
        states('binary_sensor.outside_warmer_than_inside') in ['on', 'off']
        and states('input_boolean.summer_mode')
          == states('binary_sensor.outside_warmer_than_inside')
      }}
actions:
  - alias: "Keep sending notifications until everything is closed again"
    repeat:
      until:
        - condition: state
          entity_id: binary_sensor.everything_closed
          state: "on"
      sequence:
        - action: script.snooze_notification
          data:
            title: "Close windows and doors now!"
            message: |-
              The following entities are still open, you might want to close them:
                {{ states('sensor.open_windows') }}
                {{ states('sensor.open_doors') }}
            tag: window_door_open
            icon: "mdi:window-open"
            color: yellow
            resolved_entity: binary_sensor.everything_closed
            resolved_state: "on"
          response_variable: reminder
        - if:
            - "{{ reminder.dismissed }}"
          then:
            - stop: "Notification dismissed, muted until the state changes again"
  - action: notify.mobile_app_pixel_7
    data:
      message: clear_notification
      data:
        tag: window_door_open
