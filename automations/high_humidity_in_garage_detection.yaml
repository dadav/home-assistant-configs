---
# High humidity in garage detection automation
#
# This automation detects a high humidity value in my garage.
#
id: "b3cc80e4-4039-4052-81c9-f8c25b6bc07a"
mode: single
max_exceeded: silent
alias: "High humdity in garage detection"
description: |-
  This automation detects high humidity in my garage.

  High humidity is bad because it can lead to mold. I
  should therefore always try to get it down to 50-60%.

  Reminds me every hour (or after the chosen snooze time) until
  the humidity is below the threshold again. No reminders while
  I'm probably sleeping.

  Swiping the notification away mutes it until the state changes
  and the automation triggers again.
triggers:
  - trigger: numeric_state
    entity_id:
      - sensor.garage_temp_humidity
    above: input_number.garage_setting_humidity_high
actions:
  - alias: "Keep reminding until the humidity is low again"
    repeat:
      until:
        - alias: "No numeric sensor is above the threshold (unavailable ones are ignored)"
          condition: template
          value_template: >-
            {{
              expand(['sensor.garage_temp_humidity'])
              | map(attribute='state') | select('is_number') | map('float')
              | select('>=', states('input_number.garage_setting_humidity_high') | float(100))
              | list | count == 0
            }}
      sequence:
        - alias: "Wait until I'm awake"
          wait_template: "{{ is_state('binary_sensor.probably_sleeping', 'off') }}"
          timeout: "12:00:00"
        - action: script.snooze_notification
          data:
            title: "High humidity in the garage!"
            message: |-
              Above {{ states('input_number.garage_setting_humidity_high') }}%:
              {% for s in expand(['sensor.garage_temp_humidity'])
                 if is_number(s.state)
                 and s.state | float >= states('input_number.garage_setting_humidity_high') | float %}
              - {{ s.name }} ({{ s.state }}%)
              {% endfor %}
            tag: high_humidity_garage
            icon: "mdi:water-percent"
            color: yellow
          response_variable: reminder
        - if:
            - "{{ reminder.dismissed }}"
          then:
            - stop: "Notification dismissed, muted until the state changes again"
  - action: notify.mobile_app_pixel_7
    data:
      message: clear_notification
      data:
        tag: high_humidity_garage
