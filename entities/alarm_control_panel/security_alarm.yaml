---
# Alarm control panel: Security Alarm
platform: manual
name: Security Alarm

# If true, the code is required to arm the alarm.
code_arm_required: false

# The time in seconds of the ‘arming’ state before effecting a state change.
arming_time: 300

# The time in seconds of the ‘pending’ state before triggering the alarm.
# Long enough to tap "Disarm" in the pending notification when I come home
# before the presence detection noticed me.
delay_time: &delay 60

# The time in seconds of the ‘triggered’ state in which the alarm is firing.
trigger_time: 4

# State specific settings
disarmed:
  trigger_time: 0

armed_away: &armed_defaults
  delay_time: *delay

armed_night:
  # Nobody should come in at night, so keep the entry delay short.
  delay_time: 20

armed_home:
  <<: *armed_defaults
